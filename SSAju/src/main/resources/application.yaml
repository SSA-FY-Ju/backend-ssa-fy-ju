spring:
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jackson:
    time-zone: Asia/Seoul
    # write-dates-as-timestamps 제거: Jackson 3.x SerializationFeature에서 삭제됨 → JacksonConfig 참고

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          response-format:
            type: JSON_OBJECT

  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: "ssaju-async-"
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
      pool:
        size: 5
      thread-name-prefix: "ssaju-scheduler-"

springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    supported-submit-methods: []
    enabled: true
    doc-expansion: list
  api-docs:
    path: /v3/api-docs
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}     # 1시간 (ms) 기본값
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7일 (ms) 기본값

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  shutdown: graceful
  cookie:
    secure: true   # 로컬 개발 시 application-local.yaml에서 false로 오버라이드

saju:
  fastapi:
    url: ${FASTAPI_URL}
    timeout-seconds: 3
    max-retries: 2

  openai:
    timeout-seconds: 30
    max-retries: 1

  public-data:
    url: ${PUBLIC_DATA_API_URL}
    api-key: ${PUBLIC_DATA_API_KEY}
    timeout-seconds: 5
    max-retries: 1
