name: SSAju CI/CD with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 체크아웃
      uses: actions/checkout@v4

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21' # JDK 21로 유지
        distribution: 'temurin'

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew
      working-directory: ./SSAju  

    - name: Gradle 빌드 (테스트 제외)
      run: ./gradlew build -x test
      working-directory: ./SSAju 

    - name: Docker Hub 로그인
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker 빌드 도구 설정
      uses: docker/setup-buildx-action@v3

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: ./SSAju        
        push: true
        platforms: linux/amd64
        tags: hariaus/ssaju-backend:latest

    - name: 서버 배포 (SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. 최신 이미지 가져오기
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ssaju-backend:latest
          
          # 2. 기존 컨테이너 중지 및 삭제
          sudo docker stop ssaju-container || true
          sudo docker rm ssaju-container || true
          
          # 3. 새로운 컨테이너 실행 (application.yml에 설정한 변수명과 일치시킴)
          sudo docker run -d --name ssaju-container \
            -p 8080:8080 \
            --network ssaju-network \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e DB_USERNAME="root" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e JPA_DDL_AUTO="${{ secrets.JPA_DDL_AUTO }}" \
            -e SHOW_SQL="${{ secrets.SHOW_SQL }}" \
            ${{ secrets.DOCKER_USERNAME }}/ssaju-backend:latest

          # 4. 사용하지 않는 오래된 이미지 삭제 (서버 용량 관리)
          sudo docker image prune -f
