plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

ext {
	set('springAiVersion', "2.0.0-M4")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Thymeleaf (관리자 SSR)
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// Data
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring AI (OpenAI) - Spring AI 2.x 아티팩트명 변경
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// Security (Phase 2에서 활성화 예정)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Redis (인증 세션 저장, 액세스 토큰 블랙리스트)
	// 분산락을 쓰지 않게 되면서 Redisson 의존성은 제거했다 — 프로필·만세력·결과의 중복은
	// DB 유일 제약으로 막고, 인증용 Redis는 기본 Lettuce 연결로 동작한다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Retry
	// spring-boot-starter-aop는 Spring Boot 4.0.5-M에서 제공되지 않아 spring-aspects 직접 사용
	implementation 'org.springframework.retry:spring-retry:2.0.11'
	implementation 'org.springframework:spring-aspects'

	// Swagger/OpenAPI 문서화
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'

	// Testcontainers (MySQL 통합 테스트용 - INSERT IGNORE 등 MySQL 전용 문법 검증)
	// Redis 통합 테스트는 별도 아티팩트 없이 junit-jupiter가 포함하는 core GenericContainer로 수행
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:mysql:1.20.4'
}

tasks.named('test') {
	useJUnitPlatform()
}
