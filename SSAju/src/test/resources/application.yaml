spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  ai:
    retry:
      max-attempts: 0   # Spring AI 자체 재시도 비활성화 (US2/T022-2) — 운영 설정과 일치
    openai:
      api-key: ${OPENAI_API_KEY:test-key}
      chat:
        options:
          model: gpt-4o-mini

saju:
  fastapi:
    url: http://localhost:8000
    timeout-seconds: 3
    max-retries: 2

  openai:
    timeout-seconds: 8
    max-retries: 1

  public-data:
    url: http://localhost:9000
    api-key: ${PUBLIC_DATA_API_KEY:test-key}
    timeout-seconds: 5
    max-retries: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    supported-submit-methods: []
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

jwt:
  secret: ${JWT_SECRET:test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}     # 1시간 (ms)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7일 (ms)

cors:
  allowed-origins: http://localhost:3000
  allowed-headers: Authorization,Content-Type,x-vercel-proxy

server:
  cookie:
    secure: false
