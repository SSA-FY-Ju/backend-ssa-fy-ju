spring:
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          response-format:
            type: JSON_OBJECT

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: list
  api-docs:
    path: /v3/api-docs
    enabled: true

swagger:
  auth:
    username: ${SWAGGER_USERNAME}
    password: ${SWAGGER_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000     # 1시간 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)

saju:
  fastapi:
    url: ${FASTAPI_URL}
    timeout-seconds: 3
    max-retries: 2

  openai:
    timeout-seconds: 8
    max-retries: 1

  public-data:
    url: ${PUBLIC_DATA_API_URL}
    api-key: ${PUBLIC_DATA_API_KEY}
    timeout-seconds: 5
    max-retries: 1
