name: SSAju CI/CD with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 체크아웃
      uses: actions/checkout@v4

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21' # JDK 21로 유지
        distribution: 'temurin'

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew
      working-directory: ./SSAju  

    - name: Gradle 빌드 (테스트 제외)
      run: ./gradlew build -x test
      working-directory: ./SSAju 

    - name: Docker Hub 로그인
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker 빌드 도구 설정
      uses: docker/setup-buildx-action@v3

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: ./SSAju        
        push: true
        platforms: linux/amd64
        tags: hariaus/ssaju-backend:latest

    - name: 서버 배포 (SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. 프로젝트 디렉토리로 이동
          cd ~/projects

          # 2. 최신 이미지 가져오기
          # 서버에 이미 있는 .env 파일을 도커 컴포즈가 자동으로 참조합니다.
          sudo docker compose pull ssaju-backend
          
          # 3. 컨테이너 재시작
          sudo docker compose up -d ssaju-backend

          # 4. 정리
          sudo docker image prune -f